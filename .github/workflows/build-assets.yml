name: Build portfolio assets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'rice_classification.py'
      - 'generate_report.py'
      - '.github/workflows/build-assets.yml'

permissions:
  contents: write

jobs:
  build-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt reportlab

      - name: Download UCI Rice dataset
        run: |
          mkdir -p data /tmp/uci-rice
          curl -L 'https://archive.ics.uci.edu/static/public/545/rice+cammeo+and+osmancik.zip' -o /tmp/rice.zip
          unzip -o /tmp/rice.zip -d /tmp/uci-rice
          ARFF_FILE=$(find /tmp/uci-rice -type f -iname '*.arff' | head -n 1)
          test -n "$ARFF_FILE"
          cp "$ARFF_FILE" data/Rice_Cammeo_Osmancik.arff

      - name: Run analysis and generate figures
        run: python rice_classification.py

      - name: Generate PDF report
        run: python generate_report.py

      - name: Commit generated assets
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add figures/*.png report/*.pdf
          if git diff --cached --quiet; then
            echo 'No generated asset changes to commit.'
          else
            git commit -m 'Generate project figures and PDF report [skip ci]'
            git push
          fi
